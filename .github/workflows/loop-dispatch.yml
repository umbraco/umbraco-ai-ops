name: loop-dispatch (reusable)

# Reusable workflow that routes a GitHub loop event to the repo's loop-dispatch
# routine. A caller workflow in each target repo (see
# plugins/ops-engine/skills/new-loop-routine) declares the events and calls this,
# passing the two secrets explicitly (NOT `secrets: inherit` — inherit only works when
# the caller and this workflow share an org/enterprise; consumer repos may not).
# It runs route-event.sh at the edge and fires the routine via its Fire URL ONLY when
# the event maps to a loop — so non-matching events (e.g. a Dependabot `dependencies`
# label) cost nothing, not even a routine session.
#
# CROSS-REPO ISSUES: when a caller's issues live in a SEPARATE repo from its code, the issues
# repo declares `topology.code` in `.claude/ops-repo-meta.json` and the router reads it, emitting
# `target=<code repo>` so the routine works there while reading the issue from the event repo.
# `with.target_repo` is the deprecated way of saying the same thing by hand.
#
# ROUTING OVERLAY: the effective table is the framework base merged with an optional
# `.github/ops-routing.json` in the caller repo (identity `(event,label)`, overlay wins,
# `"loop": null` disables a base rule). Most repos need none.
#
# Caller must provide two secrets (repo or org level):
#   LOOP_DISPATCH_FIRE_URL  — the routine's Fire URL (Routines UI -> Call via API)
#   LOOP_DISPATCH_TOKEN     — the token generated for that routine

on:
  workflow_call:
    inputs:
      target_repo:
        description: >-
          DEPRECATED and normally omitted. The router now derives the cross-repo target from
          the caller repo's `.claude/ops-repo-meta.json` (`topology.code`), so the fact lives
          in one place instead of being hand-set here as well. Set this only to override that
          for a one-off, and expect it to be removed.
        required: false
        type: string
        default: ""
    secrets:
      LOOP_DISPATCH_FIRE_URL:
        required: true
      LOOP_DISPATCH_TOKEN:
        required: true

# NO `permissions:` BLOCK HERE, deliberately. The token's scope is set by the CALLER's job
# (the template grants `contents: read` and `pull-requests: read`). A called workflow that asks
# for a scope its caller does not allow is refused by GitHub before any job starts — "the nested
# job is requesting 'pull-requests: read', but is only allowed 'none'" — so asking here would
# have broken every consumer still on an older caller, at once, the moment this landed on main.
# The PR-label lookup below is the only thing that needs `pull-requests: read`; with a caller
# that does not grant it, the lookup warns and the CI-finished route resolves to none.

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch route-event.sh from umbraco-ai-ops
        uses: actions/checkout@v4
        with:
          repository: umbraco/umbraco-ai-ops
          ref: main
          path: ops

      # The effective routing table is the framework BASE (in ops/) merged with this
      # repo's optional OVERLAY at .github/ops-routing.json — so the caller repo has to
      # be on disk too. Nothing else in this workflow reads it.
      - name: Check out this repo (for its routing overlay, if any)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Decide the loop (deterministic, at the edge)
        id: route
        env:
          # route-event.sh reads $TARGET_REPO and emits target= only when it differs
          # from the event repo. Empty (same-repo consumers) -> no target emitted.
          TARGET_REPO: ${{ inputs.target_repo }}
          # For the check_suite label lookup only. The caller's token, capped by the permissions
          # above and by the caller's own.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # An overlay is optional: most repos run the base table unchanged. A PRESENT but
          # broken overlay makes route-event.sh exit 2, which fails this step loudly —
          # deliberately, because a silently ignored overlay means loops stop firing.
          overlay=""
          if [ -f repo/.github/ops-routing.json ]; then
            overlay="repo/.github/ops-routing.json"
            echo "routing overlay: $overlay"
          fi
          # The repo's declared facts. In a split topology the issues repo declares
          # `topology.code`, which is how the router learns where the routine should work —
          # so `target_repo` no longer has to be set by hand in two places.
          meta=""
          if [ -f repo/.claude/ops-repo-meta.json ]; then
            meta="repo/.claude/ops-repo-meta.json"
            echo "declared repo facts: $meta"
          fi
          # $GITHUB_EVENT_PATH / $GITHUB_EVENT_NAME are the CALLER repo's triggering event.
          # route-event.sh reads the payload for action/label/repo/number (the event NAME
          # is a header, not body, so it is passed explicitly).
          router() {
            bash ops/plugins/ops-engine/skills/loop-dispatch/scripts/route-event.sh \
              --event "$GITHUB_EVENT_NAME" ${overlay:+--overlay "$overlay"} ${meta:+--repo-meta "$meta"} "$@"
          }
          if [ "$GITHUB_EVENT_NAME" = "check_suite" ]; then
            # A CI run finished. Its payload lists the PRs on that commit but not their labels,
            # and the route only fires for a PR labelled to land — so read each PR's labels here
            # and hand them to the router, which stays offline. The first PR that routes wins:
            # the merge loop sweeps every labelled PR, so one wake-up covers them all.
            out="loop=none"
            repo_full="$(jq -r '.repository.full_name' "$GITHUB_EVENT_PATH")"
            for n in $(jq -r '.check_suite.pull_requests[]?.number' "$GITHUB_EVENT_PATH"); do
              args=(--number "$n")
              if labels="$(gh api "repos/$repo_full/pulls/$n" --jq '.labels[].name' 2>&1)"; then
                while IFS= read -r l; do [ -n "$l" ] && args+=(--pr-label "$l"); done <<<"$labels"
              else
                # Say so, rather than route on no labels and look like an ordinary no-op.
                echo "::warning::could not read the labels of PR #$n ($labels). Does the caller grant pull-requests: read?"
              fi
              out="$(router "${args[@]}")"
              case "$out" in loop=none*) ;; *) break ;; esac
            done
          else
            out="$(router)"
          fi
          echo "route-event: $out"
          loop="${out#loop=}"; loop="${loop%% *}"
          {
            echo "loop=$loop"
            echo "result=$out"
          } >> "$GITHUB_OUTPUT"

      - name: Fire the routine (only when the event maps to a loop)
        if: steps.route.outputs.loop != 'none' && steps.route.outputs.loop != ''
        env:
          FIRE_URL: ${{ secrets.LOOP_DISPATCH_FIRE_URL }}
          TOKEN: ${{ secrets.LOOP_DISPATCH_TOKEN }}
          RESULT: ${{ steps.route.outputs.result }}
        run: |
          set -uo pipefail
          if [ -z "${FIRE_URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::error::LOOP_DISPATCH_FIRE_URL / LOOP_DISPATCH_TOKEN secret not set on this repo (or org)."
            exit 1
          fi
          text="loop-dispatch (cloud worker). A GitHub loop event was routed at the edge: ${RESULT}. Run the loop-dispatch skill and dispatch this already-resolved loop for that number, following loop-dispatch's guardrails (do all GitHub work via github-ops). Re-check the entity still qualifies before acting; quiet no-op if not."
          # Retry transient upstream errors (e.g. a Cloudflare 520 from the Fire endpoint):
          # --fail-with-body makes any HTTP >=400 an error, and --retry-all-errors makes
          # --retry cover non-standard 5xx codes that plain --retry ignores. A retried fire
          # is safe: loop-dispatch re-checks the entity still qualifies and quiet no-ops if
          # the first fire already handled it.
          jq -nc --arg t "$text" '{text:$t}' | \
          curl -sS -X POST "$FIRE_URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            --fail-with-body \
            --retry 3 --retry-delay 5 --retry-all-errors \
            -d @-
          echo "fired routine for route: ${RESULT}"
