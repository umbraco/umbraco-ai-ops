name: tests

# Hermetic, deterministic gate — bash + jq (+ local git) only, no network calls of their
# own, no gh, no claude. Runs every *.test.sh in the repo (skill tests under plugins/,
# engine-wide ones under scripts/), validates every JSON file with jq, and checks that a
# plugin whose files changed also bumped its plugin.json version. Runs on
# every PR and every push to main (no paths filter — the tests are cheap, and a
# paths filter only reliably matches the `opened` event, so a later push could
# add untested changes and slip through ungated).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # check-plugin-versions.sh needs enough history to resolve a base to compare
      # against (the merge base with main on a PR, the previous commit on a push) —
      # fetch-depth: 0 gets the full history and every branch, not just the triggering
      # ref, which the default fetch-depth: 1 shallow clone would not have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The generators are jq and bash, so their versions are part of the output contract.
      # Recorded on every run because a drift gate that fails only on CI is otherwise
      # impossible to diagnose from a Windows machine — which is exactly what happened.
      - name: Record the toolchain
        run: |
          echo "jq:   $(jq --version)"
          echo "bash: $BASH_VERSION"
          echo "os:   $(uname -srm)"
          echo "--- line endings of a generated file, as checked out ---"
          file evals/change.eval.json || true
          head -c 120 evals/change.eval.json | od -c | head -4

      - name: Run all tests (*.test.sh)
        run: |
          set -uo pipefail
          rc=0; found=0
          while IFS= read -r t; do
            found=1
            echo "::group::$t"
            bash "$t" || rc=1
            echo "::endgroup::"
          done < <(find . -path ./.git -prune -o -name '*.test.sh' -print | sort)
          [ "$found" = 1 ] || { echo "::error::no *.test.sh found — expected at least the router, detect and catalog tests"; exit 1; }
          exit $rc

      - name: Validate every JSON file (jq empty)
        run: |
          set -uo pipefail
          rc=0
          while IFS= read -r f; do
            jq empty "$f" 2>/dev/null || { echo "::error file=$f::invalid JSON"; rc=1; }
          done < <(find . -path ./.git -prune -o -name '*.json' -print | sort)
          exit $rc

      # Catches the failure mode where a plugin's content changes but plugin.json's
      # version does not — invisible to everyone, because the plugin cache users
      # install from is keyed by version and never refreshes on its own.
      - name: Check every changed plugin bumped its version
        run: bash scripts/check-plugin-versions.sh
