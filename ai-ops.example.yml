# Example .claude/ai-ops.yml — how the engine runs in one repo.
# Copy to `.claude/ai-ops.yml` in the CONSUMER repo (or let `/umbraco-ops-setup` write it).
# Validated by ai-ops.schema.json. Omit anything the engine can auto-detect.

# ── Umbraco.Forms: versioned gitflow, Azure DevOps CI, issues in a SEPARATE repo ──
version: 1

repos:
  source: umbraco/Umbraco.Forms          # PRs open here (auto-detected from git remote)
  inbox:  umbraco/Umbraco.Forms.Issues   # ready-for-ai issues live here (must be declared — differs from source)
  issue_link: cross-repo-full-url        # (auto, because inbox != source)

ci:
  provider: azure-pipelines              # (auto, from azure-pipelines.yml)
  ado_org: umbraco
  ado_project: Umbraco.Forms
  # gh_repo defaults to repos.source

branching:
  model: versioned-gitflow               # vN/dev + vN/main per major (auto-detected from branches)
  base: v18/dev                          # current major's integration branch (PRs target this)
  release_base: v18/main
  merge_strategy: squash
  branch_naming: "v{major}/{type}/{desc}"
  release_skill: release-management       # Forms owns cutting/tagging (nbgv, manual release-* tags) — engine defers to it

learning:
  inbox: umbraco/umbraco-ai-ops

playbook: issue-loop                      # .claude/skills/issue-loop/ carries the build playbook

# ── Minimal case (a same-repo, gitflow, GitHub-checks repo needs almost nothing) ──
# version: 1
# repos:
#   source: umbraco/Some.Repo
# # inbox defaults to source; issue_link -> same-repo-closes; ci -> github-checks;
# # branching.model -> gitflow, base -> dev, merge_strategy -> squash — all auto.
